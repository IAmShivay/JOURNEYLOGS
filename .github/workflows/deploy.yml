name: Deploy to Cloudflare Workers

on:
  release:
    types: [published]
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical

      - name: Export secrets
        run: |
          export INFISICAL_TOKEN=$(curl -s -X POST https://app.infisical.com/api/v1/auth/universal-auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          infisical export --token "$INFISICAL_TOKEN" \
            --projectId 9a8d77c4-cf7e-4230-a9cd-6d60dc2bca4b \
            --env prod \
            --path /journeylogs \
            --format dotenv > .env.deploy
          set -a && source .env.deploy && set +a
          echo "CLOUDFLARE_API_TOKEN=$(grep CLOUDFLARE_API_TOKEN .env.deploy | cut -d= -f2- | tr -d "'")" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=$(grep CLOUDFLARE_ACCOUNT_ID .env.deploy | cut -d= -f2- | tr -d "'")" >> $GITHUB_ENV

      - run: bun install

      - name: Build
        run: |
          set -a && source .env.deploy && set +a
          bun run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
