name: Deploy to VPS

on:
  release:
    types: [published]
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ubuntu
  APP_DIR: /home/ubuntu/journeylogs

jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical

      - name: Export secrets to .env
        run: |
          export INFISICAL_TOKEN=$(curl -s -X POST https://app.infisical.com/api/v1/auth/universal-auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          infisical export --token "$INFISICAL_TOKEN" \
            --projectId 9a8d77c4-cf7e-4230-a9cd-6d60dc2bca4b \
            --env prod \
            --path /journeylogs \
            --format dotenv > .env.deploy

      - name: Build
        run: |
          set -a && source .env.deploy && set +a
          NITRO_PRESET=node-server bun install && bun run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          rsync -avz --delete \
            dist/ \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/dist/

          scp .env.deploy ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/.env

      - name: Create ecosystem config
        run: |
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'SSHEOF'
            cat > /home/ubuntu/journeylogs/ecosystem.config.cjs << 'EOF'
          module.exports = {
            apps: [{
              name: "journeylogs",
              cwd: "/home/ubuntu/journeylogs",
              script: "dist/server/index.mjs",
              node_args: "--max-old-space-size=256",
              max_memory_restart: "200M",
              env_file: "/home/ubuntu/journeylogs/.env",
              env: {
                PORT: 3002,
                NODE_ENV: "production"
              }
            }]
          };
          EOF
          SSHEOF

      - name: Restart
        run: |
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
            cd /home/ubuntu/journeylogs
            pm2 delete journeylogs 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save
          EOF

      - name: Verify
        run: |
          sleep 5
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "pm2 status"
